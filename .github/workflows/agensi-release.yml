name: Update Agensi from GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version label (required for a manual run)
        required: true
        type: string
      dry_run:
        description: Validate the package without sending it to Agensi
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agensi-codex-design
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  update:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether an Agensi listing is configured
        id: target
        env:
          TARGET_SLUG: ${{ vars.AGENSI_SKILL_SLUG }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$TARGET_SLUG" ] && [ "$DRY_RUN" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Agensi upload skipped. Create the listing and set AGENSI_SKILL_SLUG to enable updates."
            echo "Agensi upload skipped: no listing slug is configured. Create the listing, then set the AGENSI_SKILL_SLUG repository variable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.target.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        if: steps.target.outputs.publish == 'true'
      - name: Update the existing Agensi listing
        if: steps.target.outputs.publish == 'true'
        env:
          AGENSI_API_KEY: ${{ secrets.AGENSI_API_KEY }}
          AGENSI_SKILL_SLUG: ${{ vars.AGENSI_SKILL_SLUG }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$RELEASE_VERSION" ]; then args+=(--version "$RELEASE_VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/publish_agensi.py "${args[@]}"
