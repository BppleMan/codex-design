name: Update Agensi from GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version label (required for a manual run)
        required: true
        type: string
      dry_run:
        description: Validate the package without sending it to Agensi
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agensi-codex-design
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  update:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Update the existing Agensi listing
        env:
          AGENSI_API_KEY: ${{ secrets.AGENSI_API_KEY }}
          AGENSI_SKILL_SLUG: ${{ vars.AGENSI_SKILL_SLUG }}
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$RELEASE_VERSION" ]; then args+=(--version "$RELEASE_VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/publish_agensi.py "${args[@]}"
